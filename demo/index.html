<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cronyome — cron 式を自然な日本語に</title>
    <meta name="description" content="cron 式を自然な日本語に変換します" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <script>
      // 描画前にテーマを当てる。main.tsx（module = defer）に任せると一瞬ちらつく
      try {
        const saved = localStorage.getItem("theme")
        if (saved === "light" || saved === "dark")
          document.documentElement.dataset.theme = saved
      } catch {}
    </script>
  </head>
  <!--
    content-start … 上揃えにする。縦中央にすると、出力が 2 行になった瞬間に
                    ロゴと入力欄まで動いてしまう
    pt-[clamp()]  … 固定したロゴの下に潜り込まないよう、上の余白を画面の高さに
                    比例させて確保する
    scrollbar-gutter … 内容が伸びてスクロールバーが出たときに横位置がずれないように
  -->
  <body
    class="grid min-h-dvh content-start justify-items-center bg-bg px-4 pt-[clamp(9rem,26vh,15rem)] pb-24 text-center leading-[1.6] font-sans text-fg [scrollbar-gutter:stable]"
  >
    <!-- 出力が長いときに行数を減らしたいので、全体は広めに取る -->
    <main id="root" class="w-full max-w-[56rem]"></main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
