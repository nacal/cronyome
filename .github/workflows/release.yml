name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm の Trusted Publishing（OIDC）に使う。トークンは保存しない
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Node 22 に同梱される npm は 10 系で、Trusted Publishing に届かない。
      # 必要なのは npm 11.5.1 以上と Node 22.14.0 以上
      - name: npm を Trusted Publishing に足りるバージョンへ上げる
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # changeset があればバージョン更新 PR を作る。無ければ何もしない
      - name: Create Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: "chore: release cronyome"
          commit: "chore: release cronyome"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # publish に `changeset publish` を使わない。
      # changesets は公開済みバージョンの判定に `pnpm info <name> --json` を使うが、
      # ランナー上の pnpm はこれを JSON 配列で返す。changesets はオブジェクトを前提に
      # info.versions を読むため undefined になり TypeError で落ちる（手元では再現しない）。
      # 判定は npm view で自分で行う
      - name: npm へ公開する
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cronyome@$VERSION" version > /dev/null 2>&1; then
            echo "cronyome@$VERSION は公開済み。何もしない"
            exit 0
          fi
          echo "cronyome@$VERSION を公開する"
          pnpm build
          npm publish --provenance --access public
          git tag "v$VERSION"
          git push origin "v$VERSION"
