name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm の Trusted Publishing（OIDC）に使う。トークンは保存しない
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Node 22 に同梱される npm は 10 系で、Trusted Publishing に届かない。
      # 必要なのは npm 11.5.1 以上と Node 22.14.0 以上
      - name: npm を Trusted Publishing に足りるバージョンへ上げる
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # changeset があればバージョン更新 PR を作り、無ければ publish する。
      # 「changeset が無ければスキップ」を挟むと、PR をマージした後の
      # publish される回だけが弾かれる。
      #
      # 認証は OIDC なので NPM_TOKEN は渡さない。ただし npm は存在しない
      # パッケージに Trusted Publisher を設定できないため、最初の 1 回だけは
      # 手元から npm publish して枠を作る必要がある
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          title: "chore: release cronyome"
          commit: "chore: release cronyome"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
