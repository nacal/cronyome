name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時実行を 1 つに絞る。進行中のデプロイは中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # デモは公開されるので、壊れたものを出さないようテストを通してからビルドする
      - run: pnpm test

      - name: デモの組み立て
        run: pnpm build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

      - id: deployment
        uses: actions/deploy-pages@v4
